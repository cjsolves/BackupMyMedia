# abcde configuration for ARM Docker
# Rips audio CDs to FLAC (lossless) using MusicBrainz for metadata.
# ARM copies this file from /etc/arm/config/abcde.conf at runtime.

# -------------------------
# Output format: FLAC (lossless audio, keeps all bit depth and sample rate)
# -------------------------
OUTPUTTYPE="flac"

# Maximum compression level (still lossless - only affects file size vs encoding speed)
FLACENCODEROPTS="--best"

# Output directory - mapped to the ARM music volume mount
OUTPUTDIR="/home/arm/music"

# -------------------------
# Processing pipeline
# -------------------------
# cddb  = fetch track metadata
# read  = read CD audio tracks
# encode= encode to FLAC
# tag   = write ID3/Vorbis tags
# move  = move files to OUTPUTDIR
# clean = remove temporary WAV files
ACTIONS=cddb,read,encode,tag,move,clean

# -------------------------
# Metadata source
# -------------------------
# musicbrainz = MusicBrainz (free, high quality, used by ARM)
CDDBMETHOD=musicbrainz
MUSICBRAINZSERVER=musicbrainz.org

# -------------------------
# Folder and filename format
# -------------------------
# Standard albums:   Artist/Album/01 - Track Title.flac
OUTPUTFORMAT='${ARTISTFILE}/${ALBUMFILE}/${TRACKNUM} - ${TRACKFILE}'

# Various artists:   Various_Artists/Album/01 - Artist - Track Title.flac
VAOUTPUTFORMAT='Various_Artists/${ALBUMFILE}/${TRACKNUM} - ${ARTISTFILE} - ${TRACKFILE}'

# Zero-pad track numbers so files sort correctly (01, 02 ... 10, 11)
PADTRACKS=y

# -------------------------
# Tagging
# -------------------------
# ID3v2 tags for maximum player compatibility
ID3TAGV=2

# -------------------------
# Automation (required for ARM - no terminal interaction available)
# -------------------------
INTERACTIVE=n
BATCH=y

# -------------------------
# Performance
# -------------------------
# Parallel encode workers (2 is safe; increase if CPU allows)
MAXPROCS=2

# CD read speed (8x is reliable; reduce to 4 if you get read errors)
CDSPEED=8
